name: Generate & Upload YouTube Short (2x/day)

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch: {}

jobs:
  generate-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run the Shorts generation pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python shorts_pipeline.py

      - name: Upload video as workflow artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video-${{ github.run_id }}
          path: |
            final_output.mp4
            voiceover.mp3
            captions.ass
            broll_manifest.json
            fact_check_log.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit & Push updated topic history
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update topic history [skip ci]"
          file_pattern: "used_topics.json"
