name: Generate & Upload YouTube Short (2x/day)

on:
  schedule:
    # Runs at 03:00 UTC and 15:00 UTC every day (~12 hours apart).
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch: {}  # Lets you trigger a run manually from the Actions tab

jobs:
  generate-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # Needed so the workflow can commit used_topics.json back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (ffmpeg + fonts for captions)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run the Shorts generation pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python shorts_pipeline.py

      # Backup generated files as GitHub Action Artifacts
      - name: Upload video as workflow artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video-${{ github.run_id }}
          path: |
            final_output.mp4
            voiceover.mp3
          retention-days: 14
          if-no-files-found: ignore

      # Programmatically merge topic history to avoid any Git merge conflicts
      - name: Persist topic history back to repo
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          
          # Safely merge JSON history using Python
          python -c '
          import json, os
          
          local_file = "used_topics.json"
          local_data = []
          if os.path.exists(local_file):
              try:
                  with open(local_file, "r") as f:
                      local_data = json.load(f)
              except Exception: pass

          os.system("git fetch origin main")
          os.system("git checkout origin/main -- used_topics.json 2>/dev/null")
          remote_data = []
          if os.path.exists(local_file):
              try:
                  with open(local_file, "r") as f:
                      remote_data = json.load(f)
              except Exception: pass

          merged = {item.get("topic"): item for item in remote_data if item.get("topic")}
          for item in local_data:
              if item.get("topic"):
                  merged[item.get("topic")] = item

          merged_list = list(merged.values())
          with open(local_file, "w", encoding="utf-8") as f:
              json.dump(merged_list, f, indent=2, ensure_ascii=False)
          '

          git add used_topics.json
          if git diff --cached --quiet; then
            echo "No new topics to push."
          else
            git commit -m "Update topic history [skip ci]"
            git push origin HEAD:main
          fi
